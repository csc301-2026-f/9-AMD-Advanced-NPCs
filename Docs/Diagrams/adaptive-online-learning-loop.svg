<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" style="max-width:100%;height:auto" role="img" aria-labelledby="title description">
  <title id="title">Adaptive NPC: native gameplay and RLtools learning</title>
  <desc id="description">Gameplay requests a decision through Schola. The native policy reads an immutable actor snapshot and returns an action and its version. Gameplay submits the completed experience to a bounded learner queue. A training worker later updates the model and publishes a new snapshot. All components run inside one process.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#334155"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #172033; }
      .title { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #475569; }
      .owner { font-size: 21px; font-weight: 700; text-anchor: middle; }
      .role { font-size: 16px; text-anchor: middle; }
      .label { font-size: 16px; text-anchor: middle; }
      .lane { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 5 5; }
      .message { stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .reply { stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="1120" height="790" rx="16" fill="#ffffff"/>
  <text x="36" y="44" class="title">Adaptive NPC: native gameplay and learning</text>
  <text x="36" y="74" class="subtitle">One process. Decisions read complete snapshots; gameplay never waits for training.</text>
  <rect x="36" y="102" width="232" height="86" rx="12" fill="#dbeafe"/>
  <rect x="310" y="102" width="232" height="86" rx="12" fill="#dcfce7"/>
  <rect x="584" y="102" width="232" height="86" rx="12" fill="#ede9fe"/>
  <rect x="858" y="102" width="226" height="86" rx="12" fill="#ffedd5"/>
  <text x="152" y="136" class="owner">Gameplay</text>
  <text x="152" y="165" class="role">Observe, execute, score</text>
  <text x="426" y="136" class="owner">Schola policy</text>
  <text x="426" y="165" class="role">Tickets + learner adapter</text>
  <text x="700" y="136" class="owner">Actor snapshot</text>
  <text x="700" y="165" class="role">Immutable RLtools policy</text>
  <text x="971" y="136" class="owner">Training worker</text>
  <text x="971" y="165" class="role">Bounded queue + SAC</text>
  <path d="M152 188V684 M426 188V684 M700 188V684 M971 188V684" class="lane"/>
  <text x="289" y="222" class="label">1. RequestDecision(observation)</text>
  <path d="M152 236H426" class="message"/>
  <text x="563" y="277" class="label">2. Act from current snapshot</text>
  <path d="M426 291H700" class="message"/>
  <text x="563" y="332" class="label">3. Action + policy version</text>
  <path d="M700 346H426" class="message reply"/>
  <text x="289" y="387" class="label">4. Read Ready action; execute once</text>
  <path d="M426 401H152" class="message reply"/>
  <text x="289" y="442" class="label">5. Submit completed experience</text>
  <path d="M152 456H426" class="message"/>
  <text x="699" y="497" class="label">6. AddExperience: enqueue numeric data</text>
  <path d="M426 511H971" class="message"/>
  <text x="289" y="552" class="label">7. Return local submission result</text>
  <path d="M426 566H152" class="message reply"/>
  <text x="835" y="622" class="label">8. Train, then publish snapshot</text>
  <path d="M971 636H700" class="message reply"/>
  <rect x="36" y="696" width="1048" height="66" rx="12" fill="#f1f5f9"/>
  <text x="560" y="723" class="label">Decision inference completes from a snapshot on the game thread; training runs on its own worker.</text>
  <text x="560" y="748" class="label">Queue acceptance does not mean training has finished. Subsequent decisions can use a new version.</text>
</svg>
